<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Card</title>
<style>
:root{--blue:#1a73e8;--blue-d:#1557b0;--bg:#f4f8ff;--line:#d6e4fb;--tx:#1f2a44;--mut:#5f6f8c;--red:#d93025;--ok:#188038}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.top b{color:var(--blue);font-size:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
h2{margin:0 0 10px;font-size:18px}h3{margin:0 0 8px;font-size:15px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
input:focus,textarea:focus{outline:2px solid var(--blue);border-color:var(--blue)}
textarea{min-height:80px;resize:vertical}
button,.btn{display:inline-block;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
button:hover,.btn:hover{background:var(--blue-d)}
button.ghost,.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
button.red{background:var(--red)}
button:disabled{opacity:.5;cursor:not-allowed}
.full{width:100%;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:#fff}
.item:hover{background:var(--bg)}
.chip{font-size:12px;padding:2px 8px;border-radius:20px;background:#e8f0fe;color:var(--blue)}
.chip.g{background:#e6f4ea;color:var(--ok)}
.mut{color:var(--mut);font-size:13px}
.msg{padding:10px 12px;border-radius:10px;margin-top:12px;font-size:14px;background:#e8f0fe}
.msg.err{background:#fce8e6;color:var(--red)}.msg.ok{background:#e6f4ea;color:var(--ok)}
.log{font-size:13px;border-bottom:1px solid var(--line);padding:6px 0;word-break:break-word}
.pub{text-align:center}
.pub h1{margin:4px 0;font-size:26px}
.addr{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0;color:var(--tx);text-decoration:none;font-weight:600}
.addr svg{width:38px;height:38px;flex:none}
.rate{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;margin:14px 0 2px}
.rate svg{width:44px;height:44px;flex:none}
.rate .st{font-size:34px;color:#f9ab00;letter-spacing:2px}
.lk{display:flex;align-items:center;gap:14px;margin:10px 0;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--tx);text-decoration:none;font-weight:600;font-size:18px;text-align:left}
.lk svg{width:46px;height:46px;flex:none}
.lk.off{background:#f1f3f4;color:var(--mut)}
.lk.off svg{filter:grayscale(1);opacity:.55}
.qrbox{width:150px;margin:18px auto 0}
.qrbox svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2a44;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;display:none;max-width:90%;text-align:center;z-index:20}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== YAHAN NAYE SUPABASE PROJECT KI DETAILS PASTE KARO ======
const SUPABASE_URL = 'https://mxyqloznpqnckclpomcf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nHmfAmzOxlNCcQj6vskebQ_z44TXvl7';
// ===============================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => { u = (u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; };
const waUrl = u => { u = (u || '').trim(); if (/^\+?\d[\d\s-]{7,}$/.test(u)) return 'https://wa.me/' + u.replace(/\D/g, ''); return safeUrl(u); };
const FIELDS = [['shop_name','Shop name','text'],['description','Short description','area'],['address','Address','area'],['phone','Contact number','text'],['whatsapp','WhatsApp chat link','text'],['instagram','Instagram link','text'],['facebook','Facebook link','text'],['google_review','Google Review link','text']];
const pubLink = id => location.origin + location.pathname.replace(/\/shop\/\d+\/?$/, '/') + '?shop=' + id;

const IC = {
  wa: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#25D366"/><path fill="#fff" d="M24 11a13 13 0 0 0-11 19.8L11 37l6.4-2A13 13 0 1 0 24 11zm6.6 17.9c-.3.8-1.7 1.5-2.3 1.6-.6.1-1.3.1-2.1-.1-.5-.2-1.1-.4-1.9-.7-3.3-1.4-5.4-4.7-5.6-4.9-.2-.2-1.3-1.7-1.3-3.2s.8-2.3 1.1-2.6c.3-.3.6-.4.8-.4h.6c.2 0 .5-.1.7.5l1 2.3c.1.2.1.4 0 .6l-.4.6-.5.5c-.2.2-.3.4-.1.7.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2.2 1.1c.3.1.5.2.5.4.1.2.1.8-.2 1.6z"/></svg>',
  ig: '<svg viewBox="0 0 48 48"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#fa7e1e"/><stop offset=".65" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#ig)"/><rect x="11" y="11" width="26" height="26" rx="8" fill="none" stroke="#fff" stroke-width="3"/><circle cx="24" cy="24" r="6" fill="none" stroke="#fff" stroke-width="3"/><circle cx="32" cy="16" r="2" fill="#fff"/></svg>',
  fb: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#1877F2"/><path fill="#fff" d="M26 38V26h4l.6-4.6H26v-3c0-1.3.4-2.2 2.3-2.2H31v-4.1c-.4 0-1.9-.2-3.5-.2-3.5 0-5.9 2.1-5.9 6v3.5h-4.1V26h4.1v12z"/></svg>',
  ph: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#34a853"/><g transform="translate(12 12)"><path fill="#fff" d="M20 15.5c-1.25 0-2.45-.2-3.57-.57a1 1 0 0 0-1.02.24l-2.2 2.2a15.05 15.05 0 0 1-6.59-6.59l2.2-2.21a1 1 0 0 0 .25-1A11.4 11.4 0 0 1 8.5 4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1 17 17 0 0 0 17 17 1 1 0 0 0 1-1v-3.5a1 1 0 0 0-1-1z"/></g></svg>',
  g: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#fff" stroke="#dadce0" stroke-width="2"/><text x="24" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="30" fill="#4285F4">G</text></svg>',
  map: '<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 4C16.5 4 10.5 9.8 10.5 17.2 10.5 27 24 44 24 44s13.5-17 13.5-26.8C37.5 9.8 31.5 4 24 4z"/><circle cx="24" cy="17.5" r="5.5" fill="#fff"/></svg>'
};

function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2600); }
function msg(box, text, kind) { $(box).innerHTML = text ? `<div class="msg ${kind || ''}">${esc(text)}</div>` : ''; }
function shell(inner, right) { app.innerHTML = `<div class="top"><b>Digital Card</b><span>${right || ''}</span></div><div class="wrap">${inner}</div>`; }
async function logout() { await sb.auth.signOut(); location.href = location.pathname; }

// QR helpers (drawn locally, no internet needed)
function qrMatrix(text) { const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(); const d = []; for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d.push([r, c]); return { n, d }; }
function qrSvg(text) {
  const { n, d } = qrMatrix(text), m = 4, t = n + 2 * m;
  return `<svg viewBox="0 0 ${t} ${t}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="${t}" height="${t}" fill="#fff"/>${d.map(([r, c]) => `<rect x="${c + m}" y="${r + m}" width="1" height="1"/>`).join('')}</svg>`;
}
function qrDownload(text, name) {
  const { n, d } = qrMatrix(text), m = 4, s = 12, t = (n + 2 * m) * s;
  const cv = document.createElement('canvas'); cv.width = cv.height = t;
  const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, t, t); x.fillStyle = '#000';
  d.forEach(([r, c]) => x.fillRect((c + m) * s, (r + m) * s, s, s));
  cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click(); });
}

async function start() {
  const m = location.pathname.match(/\/shop\/(\d+)\/?$/);
  const q = new URLSearchParams(location.search).get('shop');
  const id = m ? m[1] : q;
  if (id) return publicPage(Number(id));
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginPage();
  const { data: ok } = await sb.rpc('is_admin');
  if (!ok) { await sb.auth.signOut(); return loginPage('This account is not admin.'); }
  adminPage();
}

// ---------- PUBLIC DASHBOARD ----------
async function publicPage(id) {
  const { data } = await sb.rpc('get_public_card', { p_id: id });
  const s = data && data[0];
  if (!s) { shell('<div class="card pub"><h2>User not found</h2></div>'); return; }
  const gr = safeUrl(s.google_review);
  const row = (ic, label, url, tel) => url
    ? `<a class="lk" href="${esc(url)}"${tel ? '' : ' target="_blank" rel="noopener"'}>${ic}<span>${label}</span></a>`
    : `<a class="lk off" href="#" data-nf="1">${ic}<span>${label}</span></a>`;
  const ph = (s.phone || '').trim();
  const mapUrl = s.address ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.address) : '';
  shell(`<div class="card pub">
    <h1>${esc(s.shop_name) || 'Shop'}</h1>
    <div class="mut" style="white-space:pre-line">${esc(s.description)}</div>
    ${mapUrl ? `<a class="addr" href="${esc(mapUrl)}" target="_blank" rel="noopener">${IC.map}<span style="white-space:pre-line">${esc(s.address)}</span></a>` : ''}
    <a class="rate" ${gr ? `href="${esc(gr)}" target="_blank" rel="noopener"` : 'href="#" data-nf="1"'}>${IC.g}<span class="st">★★★★★</span></a>
    <div class="mut">Rate us on Google</div>
    <div style="margin-top:12px">
    ${row(IC.ph, ph ? esc(ph) : 'Call', ph ? 'tel:' + ph : '', true)}
    ${row(IC.wa, 'WhatsApp', waUrl(s.whatsapp))}
    ${row(IC.ig, 'Instagram', safeUrl(s.instagram))}
    ${row(IC.fb, 'Facebook', safeUrl(s.facebook))}</div>
    <div class="qrbox">${qrSvg(pubLink(id))}</div>
    <div class="mut" style="margin-top:6px">Scan to open this card</div>
  </div>`);
  document.querySelectorAll('[data-nf]').forEach(el => el.onclick = e => { e.preventDefault(); toast('User not found — इस दुकान ने यह लिंक नहीं जोड़ा है'); });
}

// ---------- ADMIN LOGIN ----------
function loginPage(err) {
  shell(`<div class="card"><h2>Admin Login</h2>
    <label>Email</label><input id="em" type="email" autocapitalize="none" autocomplete="username">
    <label>Password</label><input id="p" type="password" autocomplete="current-password">
    <button class="full" id="go">Login</button><div id="m"></div></div>`);
  if (err) msg('#m', err, 'err');
  $('#go').onclick = async () => {
    $('#go').disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#p').value });
    if (error) { $('#go').disabled = false; return msg('#m', 'Wrong email or password.', 'err'); }
    start();
  };
}

// ---------- ADMIN ----------
async function adminPage() {
  const { data: cards } = await sb.from('cards').select('*').order('id');
  const list = (cards || []).map(c => `<div class="item" data-id="${c.id}"><div><b>#${c.id} ${esc(c.shop_name) || '(खाली कार्ड)'}</b><div class="mut">${new Date(c.created_at).toLocaleDateString()}</div></div>
    <span class="chip ${c.published ? 'g' : ''}">${c.published ? 'Public' : 'Hidden'}</span></div>`).join('') || '<div class="mut">अभी कोई कार्ड नहीं।</div>';
  shell(`<div class="card"><h2>Cards (${(cards || []).length})</h2>
    <div class="row"><button id="nw">+ नया कार्ड</button><button class="ghost" id="n10">+10 खाली कार्ड</button></div><div id="am"></div>
    ${list}</div>`, '<button class="ghost" onclick="logout()">Logout</button>');
  document.querySelectorAll('.item').forEach(el => el.onclick = () => adminCard(Number(el.dataset.id)));
  $('#nw').onclick = async () => {
    const { data, error } = await sb.from('cards').insert({ shop_name: '' }).select().single();
    if (error) return msg('#am', 'Could not create card.', 'err');
    adminCard(data.id);
  };
  $('#n10').onclick = async () => {
    if (!confirm('10 खाली कार्ड बनाएँ?')) return;
    const { error } = await sb.from('cards').insert(Array.from({ length: 10 }, () => ({ shop_name: '' })));
    if (error) return msg('#am', 'Could not create cards.', 'err');
    adminPage();
  };
}
async function adminCard(id) {
  const [{ data: s }, { data: logs }] = await Promise.all([
    sb.from('cards').select('*').eq('id', id).single(),
    sb.from('change_log').select('*').eq('card_id', id).order('created_at', { ascending: false }).limit(60)]);
  const link = pubLink(id);
  const f = FIELDS.map(([k, l, t]) => `<label>${l}</label>` + (t === 'area' ? `<textarea id="f_${k}">${esc(s[k])}</textarea>` : `<input id="f_${k}" value="${esc(s[k])}">`)).join('');
  const lg = (logs || []).map(l => `<div class="log"><b>${esc(l.field)}</b> · ${new Date(l.created_at).toLocaleString()}<br>${esc(l.old_value) || '—'} → ${esc(l.new_value) || '—'}</div>`).join('') || '<div class="mut">No changes yet.</div>';
  shell(`<button class="ghost" id="bk">← All cards</button>
    <div class="card"><h2>Card #${s.id}</h2>${f}
    <button class="full" id="save">Save changes</button><div id="em"></div>
    <div class="row"><button id="tp" class="${s.published ? 'ghost' : ''}">${s.published ? 'Hide (unpublish)' : 'Make public'}</button><button class="red" id="dl">Delete</button></div></div>
    <div class="card"><h3>Public link (NFC chip / QR)</h3><input id="pl" readonly value="${esc(link)}">
    <div class="row"><button class="ghost" id="cp">Copy link</button><a class="btn ghost" href="${esc(link)}" target="_blank">Open page</a></div>
    <div class="qrbox" style="margin-top:14px">${qrSvg(link)}</div>
    <button class="full" id="qd">Download QR image</button></div>
    <div class="card"><h3>Change history</h3>${lg}</div>`, '<button class="ghost" onclick="logout()">Logout</button>');
  $('#bk').onclick = adminPage;
  $('#cp').onclick = () => { $('#pl').select(); navigator.clipboard && navigator.clipboard.writeText(link); msg('#em', 'Link copied.', 'ok'); };
  $('#qd').onclick = () => qrDownload(link, 'card-' + id + '-qr.png');
  $('#save').onclick = async () => {
    const upd = {}; FIELDS.forEach(([k]) => upd[k] = $('#f_' + k).value.trim());
    const { error } = await sb.from('cards').update(upd).eq('id', id);
    if (error) return msg('#em', 'Could not save.', 'err');
    msg('#em', 'Saved.', 'ok'); setTimeout(() => adminCard(id), 700);
  };
  $('#tp').onclick = async () => { await sb.from('cards').update({ published: !s.published }).eq('id', id); adminCard(id); };
  $('#dl').onclick = async () => {
    if (!confirm('Delete this card permanently?')) return;
    const { error } = await sb.from('cards').delete().eq('id', id);
    if (error) return msg('#em', 'Delete failed.', 'err');
    adminPage();
  };
}

start();
</script>
</body>
</html>
